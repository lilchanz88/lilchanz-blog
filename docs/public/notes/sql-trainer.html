<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL 闯关练习 · 海运数仓</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --panel:#1c2128; --panel2:#22272e;
    --line:#30363d; --line2:#444c56;
    --text:#e6edf3; --sub:#8b949e; --muted:#6e7681;
    --accent:#f0883e; --accent2:#ffa657; --accent3:#d29922;
    --ok:#3fb950; --ok2:#2ea043; --warn:#d29922; --bad:#f85149;
    --purple:#bc8cff; --teal:#39c5cf;
    --mono:'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    font-size:14px;line-height:1.6;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  a{color:var(--accent2);text-decoration:none}

  header{padding:18px 24px 14px;background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--line);flex:0 0 auto}
  .hdr-top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent3));
    display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
  .title{font-size:20px;font-weight:700;letter-spacing:.3px}
  .subtitle{color:var(--sub);font-size:12px;margin-top:1px}
  .mode-switch{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;margin-top:8px;width:fit-content}
  .mode-switch button{background:transparent;border:none;color:var(--sub);padding:6px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
  .mode-switch button.active{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line2)}

  .scroll{flex:1;overflow-y:auto;padding:18px 24px}

  .tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-bottom:16px}
  .table-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;transition:.15s}
  .table-card:hover{border-color:var(--line2)}
  .table-name{font-size:14px;font-weight:600;color:var(--accent2);margin-bottom:2px;display:flex;align-items:center;gap:6px}
  .table-name .badge{font-size:10px;background:var(--panel2);color:var(--sub);padding:1px 6px;border-radius:8px;font-weight:400}
  .table-desc{font-size:11px;color:var(--muted);margin-bottom:10px}
  .field-table{width:100%;border-collapse:collapse;font-size:12px}
  .field-table th{color:var(--sub);font-weight:500;padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:11px}
  .field-table td{padding:5px 8px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--text)}
  .field-table td.type{color:var(--teal);white-space:nowrap}
  .field-table td.comment{color:var(--muted);font-family:inherit;font-size:11px}
  .field-table tr:last-child td{border-bottom:none}
  .sample{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px;color:var(--sub)}
  .sample .label{color:var(--muted);margin-bottom:4px;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
  .sample pre{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:var(--mono);
    color:var(--text);font-size:11px;overflow-x:auto;white-space:pre;margin:0;line-height:1.5}

  .stage-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0 14px;border-top:1px solid var(--line);margin-top:6px}
  .stage-pill{font-size:12px;padding:6px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
    color:var(--sub);cursor:pointer;transition:.15s;font-weight:500;display:flex;align-items:center;gap:6px}
  .stage-pill:hover{border-color:var(--line2);color:var(--text)}
  .stage-pill.active{background:var(--panel2);color:var(--text);border-color:var(--accent)}
  .stage-pill .cnt{font-size:10px;color:var(--muted);background:var(--bg2);padding:1px 6px;border-radius:8px;font-weight:400}
  .stage-pill.active .cnt{background:var(--accent);color:#1a1a1a}
  .progress-wrap{flex:1;display:flex;align-items:center;gap:10px;min-width:200px;margin-left:8px}
  .progress-label{font-size:12px;color:var(--sub);white-space:nowrap}
  .progress-bar{flex:1;height:6px;background:var(--panel);border-radius:3px;overflow:hidden;position:relative}
  .progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--ok2),var(--accent));border-radius:3px;transition:width .3s}
  .progress-num{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}

  .work{display:grid;grid-template-columns:340px 1fr;gap:14px;min-height:0}
  .qlist-pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:520px;max-height:600px}
  .qlist-head{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .qlist-head .meta{font-size:11px;color:var(--muted);font-weight:400}
  .qlist-body{flex:1;overflow-y:auto;padding:6px}
  .qitem{padding:9px 12px;border-radius:7px;cursor:pointer;margin-bottom:2px;border:1px solid transparent;transition:.12s}
  .qitem:hover{background:var(--panel2)}
  .qitem.active{background:var(--panel2);border-color:var(--accent)}
  .qitem.done{opacity:.75}
  .qitem .top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
  .qitem .qid{font-size:11px;color:var(--muted);font-family:var(--mono);font-weight:500}
  .qitem .qtitle{font-size:13px;font-weight:500;flex:1;line-height:1.4}
  .qitem .badge{font-size:10px;padding:1px 6px;border-radius:6px;font-weight:600;white-space:nowrap}
  .qitem .badge.简单{background:#1a3a23;color:var(--ok)}
  .qitem .badge.中等{background:#3a2a13;color:var(--warn)}
  .qitem .badge.困难{background:#3a1c1c;color:var(--bad)}
  .qitem .meta{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:3px}
  .qitem .linked{color:var(--accent3)}

  .qdetail-pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:520px;max-height:600px}
  .qdetail-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .qdetail-head .left{flex:1;min-width:0}
  .qdetail-head .qid{font-size:11px;color:var(--muted);font-family:var(--mono)}
  .qdetail-head .qt{font-size:15px;font-weight:600;margin:4px 0 6px}
  .qdetail-head .links{font-size:11px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .qdetail-head .links .tag{background:var(--bg2);border:1px solid var(--line);padding:1px 7px;border-radius:8px;color:var(--sub)}
  .qdetail-head .actions{display:flex;gap:6px;flex:0 0 auto}
  .qdetail-body{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .qdesc{padding:12px 18px;font-size:13px;color:var(--sub);line-height:1.7;border-bottom:1px solid var(--line);white-space:pre-wrap;max-height:120px;overflow-y:auto}
  .qschema{padding:10px 18px;border-bottom:1px solid var(--line);background:var(--bg2);max-height:160px;overflow-y:auto}
  .qschema .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  .qschema pre{margin:0;font-family:var(--mono);font-size:11.5px;color:var(--sub);white-space:pre;line-height:1.5}
  .qeditor-wrap{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px 18px}
  .qeditor-wrap .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
  .qeditor-wrap textarea{flex:1;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--text);
    padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:none;outline:none;min-height:120px}
  .qeditor-wrap textarea:focus{border-color:var(--accent)}
  .qactions{padding:10px 18px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px 14px;border-radius:7px;font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1a1a;font-weight:600}
  .btn.primary:hover{background:var(--accent2)}
  .btn.ghost{background:transparent}
  .qref{display:none;margin-top:8px;background:#0a1f12;border:1px solid var(--ok2);border-radius:7px;padding:10px 12px}
  .qref.show{display:block}
  .qref pre{margin:0;font-family:var(--mono);font-size:11.5px;color:var(--ok);white-space:pre-wrap;line-height:1.6;word-break:break-all}

  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty .big{font-size:42px;margin-bottom:12px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);
    border:1px solid var(--line);color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:100;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:var(--ok2)}
  .toast.bad{border-color:var(--bad)}
</style>
</head>
<body>
<header>
  <div class="hdr-top">
    <div class="logo">🐳</div>
    <div>
      <div class="title">SQL 闯关练习</div>
      <div class="subtitle">海运数仓 · 5阶段闯关 · 基础做完就能解终极题</div>
    </div>
  </div>
  <div class="mode-switch" id="modeSwitch">
    <button class="active" data-mode="stage">🎯 闯关模式</button>
    <button data-mode="free">📚 自由练习</button>
  </div>
</header>

<div class="scroll" id="mainScroll">
  <div class="tables" id="tablesArea"></div>
  <div class="stage-bar" id="stageBar"></div>
  <div class="work">
    <div class="qlist-pane">
      <div class="qlist-head"><span>题目列表</span><span class="meta" id="qlistMeta"></span></div>
      <div class="qlist-body" id="qlistBody"></div>
    </div>
    <div class="qdetail-pane" id="qdetailPane">
      <div class="empty" id="qempty">
        <div class="big">👈</div>
        <p>左侧选择一道题开始闯关</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORE = 'sql-trainer-questions-v1';
const PROGRESS = 'sql-trainer-progress-v1';

const STAGES = [
  { id:0, name:'基础闯关', color:'#3fb950', desc:'SQL 基本功' },
  { id:1, name:'初级闯关', color:'#39c5cf', desc:'JOIN + GROUP BY' },
  { id:2, name:'中级闯关', color:'#d29922', desc:'窗口函数 + 时间' },
  { id:3, name:'高级闯关', color:'#bc8cff', desc:'多CTE + 倾斜处理' },
  { id:4, name:'终极闯关', color:'#f85149', desc:'海运 5 大综合题' }
];

const SAMPLE_TABLES = [
  { name:'dwd_sea_container_full', alias:'柜清单快照', comment:'每个柜按 dt 的全量快照',
    fields:[
      {n:'container_no', t:'VARCHAR(50)', c:'柜号（主键）'},
      {n:'cust_id', t:'VARCHAR(50)', c:'客户ID'},
      {n:'dest_port', t:'VARCHAR(50)', c:'目的港'},
      {n:'book_weight', t:'DECIMAL(12,2)', c:'订舱重量'},
      {n:'book_volume', t:'DECIMAL(12,2)', c:'订舱体积'},
      {n:'old_plan_sail_date', t:'DATE', c:'计划开船日'},
      {n:'dt', t:'VARCHAR(10)', c:'快照日期 yyyy-MM-dd'},
      {n:'del_flag', t:'INT', c:'删除标记 0/1'}
    ],
    sample:"('CTN001','C001','上海港', 20.0, 30.0, '2026-07-10','2026-07-31',0)\n('CTN003','C002','宁波港', 15.0, 20.0, '2026-07-10','2026-07-31',0)\n('CTN005','C003','深圳港', 10.0, 15.0, '2026-07-12','2026-07-31',0)"
  },
  { name:'dwd_sea_goods_inbound_full', alias:'入库明细', comment:'每条入库操作一条记录（事实）',
    fields:[
      {n:'cargo_no', t:'VARCHAR(50)', c:'票号'},
      {n:'container_no', t:'VARCHAR(50)', c:'柜号'},
      {n:'inbound_time', t:'DATETIME', c:'入库时间'},
      {n:'actual_weight', t:'DECIMAL(12,2)', c:'实际重量'},
      {n:'actual_volume', t:'DECIMAL(12,2)', c:'实际体积'},
      {n:'inbound_type', t:'VARCHAR(20)', c:'正常/退仓'},
      {n:'data_status', t:'VARCHAR(20)', c:'有效/无效'},
      {n:'del_flag', t:'INT', c:'0/1'}
    ],
    sample:"('BL001','CTN001','2026-07-05 10:00', 8.0, 12.0, '正常','有效',0)\n('BL004','CTN003','2026-07-10 14:00', 9.0, 14.0, '正常','有效',0)\n('BL005','CTN004','2026-07-12 16:00', 9.0, 14.0, '退仓','有效',0)"
  },
  { name:'dwd_sea_container_change', alias:'换柜流水', comment:'缓慢变化维：每次换柜留痕',
    fields:[
      {n:'cargo_no', t:'VARCHAR(50)', c:'票号'},
      {n:'old_container_no', t:'VARCHAR(50)', c:'旧柜号'},
      {n:'new_container_no', t:'VARCHAR(50)', c:'新柜号'},
      {n:'change_time', t:'DATETIME', c:'换柜时间'}
    ],
    sample:"('BL004','CTN003','CTN004','2026-07-11 08:00:00')"
  },
  { name:'dwd_sea_booking_full', alias:'订舱快照', comment:'订舱每日全量快照（dt分区）',
    fields:[
      {n:'booking_id', t:'VARCHAR(50)', c:'订舱ID'},
      {n:'container_no', t:'VARCHAR(50)', c:'柜号'},
      {n:'cust_id', t:'VARCHAR(50)', c:'客户ID'},
      {n:'container_status', t:'VARCHAR(20)', c:'已配柜/已出运/已签收'},
      {n:'plan_sail_date', t:'DATE', c:'计划开船日'},
      {n:'create_time', t:'DATETIME', c:'创建时间'},
      {n:'dt', t:'VARCHAR(10)', c:'快照日期'},
      {n:'del_flag', t:'INT', c:'0/1'}
    ],
    sample:"('BK001','CTN001','C001','已签收','2026-07-10','2026-07-01 09:00','2026-07-31',0)\n('BK002','CTN002','C001','已配柜','2026-07-12','2026-07-01 09:00','2026-07-31',1)\n('BK003','CTN003','C002','已签收','2026-07-10','2026-07-01 09:00','2026-07-31',0)"
  },
  { name:'dim_cust', alias:'客户主表', comment:'客户维度',
    fields:[
      {n:'cust_id', t:'VARCHAR(50)', c:'客户ID（主键）'},
      {n:'cust_name', t:'VARCHAR(100)', c:'客户名称'}
    ],
    sample:"('C001','甲客户')\n('C002','乙客户')\n('C003','丙客户')"
  }
];

const SAMPLE = [
  // ===== Stage 0 基础闯关 =====
  { id:'B1', title:'查询所有客户的姓名和客户ID', level:'简单', stage:0, linked:[], tags:['SELECT'],
    desc:'从 dim_cust 表查询所有客户的 cust_id 和 cust_name。',
    schema:'CREATE TABLE dim_cust (\n  cust_id VARCHAR(50),\n  cust_name VARCHAR(100)\n);',
    ref:"SELECT cust_id, cust_name\nFROM dim_cust;"
  },
  { id:'B2', title:'查询客户信息，按 cust_id 降序', level:'简单', stage:0, linked:[], tags:['ORDER BY'],
    desc:'按 cust_id 倒序展示所有客户。',
    schema:'CREATE TABLE dim_cust (\n  cust_id VARCHAR(50),\n  cust_name VARCHAR(100)\n);',
    ref:"SELECT cust_id, cust_name\nFROM dim_cust\nORDER BY cust_id DESC;"
  },
  { id:'B3', title:'查询入库重量大于 10 的所有入库记录', level:'简单', stage:0, linked:[], tags:['WHERE'],
    desc:'从 dwd_sea_goods_inbound_full 查 actual_weight > 10 的记录，显示 cargo_no、container_no、actual_weight。',
    schema:'CREATE TABLE dwd_sea_goods_inbound_full (\n  cargo_no VARCHAR(50),\n  container_no VARCHAR(50),\n  actual_weight DECIMAL(12,2),\n  data_status VARCHAR(20),\n  del_flag INT\n);',
    ref:"SELECT cargo_no, container_no, actual_weight\nFROM dwd_sea_goods_inbound_full\nWHERE actual_weight > 10\n  AND data_status = '有效' AND del_flag = 0;"
  },
  { id:'B4', title:'查询 2026-07-10 及之后入库的货物', level:'简单', stage:0, linked:[], tags:['WHERE','日期'],
    desc:'从入库明细表查 inbound_time >= 2026-07-10 的所有记录。',
    schema:'CREATE TABLE dwd_sea_goods_inbound_full (\n  cargo_no VARCHAR(50),\n  container_no VARCHAR(50),\n  inbound_time DATETIME,\n  data_status VARCHAR(20)\n);',
    ref:"SELECT cargo_no, container_no, inbound_time\nFROM dwd_sea_goods_inbound_full\nWHERE inbound_time >= '2026-07-10'\n  AND data_status = '有效';"
  },
  { id:'B5', title:'统计每个柜的入库票数', level:'简单', stage:0, linked:['Q1'], tags:['COUNT','GROUP BY'],
    desc:'按 container_no 统计入库票数（去重 cargo_no）。',
    schema:'CREATE TABLE dwd_sea_goods_inbound_full (\n  cargo_no VARCHAR(50),\n  container_no VARCHAR(50),\n  data_status VARCHAR(20),\n  del_flag INT\n);',
    ref:"SELECT container_no, COUNT(DISTINCT cargo_no) AS ticket_cnt\nFROM dwd_sea_goods_inbound_full\nWHERE data_status = '有效' AND del_flag = 0\nGROUP BY container_no;"
  },
  { id:'B6', title:'统计每个客户的柜数', level:'简单', stage:0, linked:[], tags:['GROUP BY','COUNT'],
    desc:'按 cust_id 统计柜清单里每个客户的柜数。',
    schema:'CREATE TABLE dwd_sea_container_full (\n  container_no VARCHAR(50),\n  cust_id VARCHAR(50),\n  dt VARCHAR(10),\n  del_flag INT\n);',
    ref:"SELECT cust_id, COUNT(1) AS container_cnt\nFROM dwd_sea_container_full\nWHERE dt = '2026-07-31' AND del_flag = 0\nGROUP BY cust_id;"
  },
  { id:'B7', title:'查询每个柜的入库总重量', level:'简单', stage:0, linked:['Q1','Q5'], tags:['SUM','GROUP BY'],
    desc:'按 container_no 汇总 actual_weight，显示柜号和总重量。',
    schema:'CREATE TABLE dwd_sea_goods_inbound_full (\n  cargo_no VARCHAR(50),\n  container_no VARCHAR(50),\n  actual_weight DECIMAL(12,2),\n  data_status VARCHAR(20),\n  del_flag INT\n);',
    ref:"SELECT container_no, SUM(actual_weight) AS total_w\nFROM dwd_sea_goods_inbound_full\nWHERE data_status = '有效' AND del_flag = 0\nGROUP BY container_no;"
  },
  { id:'B8', title:'查询每个客户的订舱关联总重量', level:'简单', stage:0, linked:[], tags:['JOIN','SUM'],
    desc:'JOIN 柜清单和入库明细，统计每个客户订舱关联的总重量。',
    schema:'-- 见顶部 dwd_sea_container_full、dwd_sea_goods_inbound_full 表',
    ref:"SELECT c.cust_id, SUM(i.actual_weight) AS total_w\nFROM dwd_sea_container_full c\nJOIN dwd_sea_goods_inbound_full i\n  ON c.container_no = i.container_no\nWHERE c.dt = '2026-07-31' AND c.del_flag = 0\n  AND i.data_status = '有效' AND i.del_flag = 0\nGROUP BY c.cust_id;"
  },

  // ===== Stage 1 初级闯关 =====
  { id:'J1', title:'列出所有柜号及对应客户名（LEFT JOIN）', level:'中等', stage:1, linked:['Q1'], tags:['LEFT JOIN'],
    desc:'LEFT JOIN 柜清单和客户主表，显示柜号和客户名（无客户的柜也要显示）。',
    schema:'-- 见顶部两张表',
    ref:"SELECT c.container_no, cu.cust_name\nFROM dwd_sea_container_full c\nLEFT JOIN dim_cust cu ON c.cust_id = cu.cust_id\nWHERE c.dt = '2026-07-31' AND c.del_flag = 0;"
  },
  { id:'J2', title:'查询每票货的所有换柜记录', level:'中等', stage:1, linked:['Q1'], tags:['GROUP BY'],
    desc:'按 cargo_no 统计换柜流水表里的换柜次数。',
    schema:'CREATE TABLE dwd_sea_container_change (\n  cargo_no VARCHAR(50),\n  old_container_no VARCHAR(50),\n  new_container_no VARCHAR(50),\n  change_time DATETIME\n);',
    ref:"SELECT cargo_no, COUNT(1) AS change_cnt\nFROM dwd_sea_container_change\nGROUP BY cargo_no;"
  },

  // ===== Stage 4 终极闯关 =====
  { id:'Q1', title:'Q1 换柜数据精准统计', level:'简单', stage:4, linked:[], tags:['换柜','补0','ROW_NUMBER'],
    isFinal:true,
    desc:'货物换柜后，旧柜数据残留在入库明细里。统计每个柜的最终总重量、总体积、票数。\n\n📌 关联基础题：J1/J2/J3/J4 + Z1/Z2/Z3 + G3\n\n口径：7月入库 / 有效 / 剔退仓 / 换柜按最新柜号 / 无入库补0',
    schema:'CREATE TABLE dwd_sea_container_full (\n  container_no VARCHAR(50),\n  cust_id VARCHAR(50),\n  dest_port VARCHAR(50),\n  book_weight DECIMAL(12,2),\n  book_volume DECIMAL(12,2),\n  dt VARCHAR(10),\n  del_flag INT\n);\n\nCREATE TABLE dwd_sea_goods_inbound_full (\n  cargo_no VARCHAR(50),\n  container_no VARCHAR(50),\n  inbound_time DATETIME,\n  actual_weight DECIMAL(12,2),\n  actual_volume DECIMAL(12,2),\n  inbound_type VARCHAR(20),\n  data_status VARCHAR(20),\n  del_flag INT\n);\n\nCREATE TABLE dwd_sea_container_change (\n  cargo_no VARCHAR(50),\n  old_container_no VARCHAR(50),\n  new_container_no VARCHAR(50),\n  change_time DATETIME\n);',
    ref:`WITH container_map AS (
  SELECT cargo_no, new_container_no AS latest_no,

  FROM dwd_sea_container_change
),
valid_inbound AS (
  SELECT * FROM dwd_sea_goods_inbound_full
  WHERE data_status = '有效' AND del_flag = 0
    AND inbound_type <> '退仓'

migrated AS (

         i.cargo_no, i.actual_weight, i.actual_volume

SELECT b.container_no,
       COALESCE(SUM(g.actual_weight), 0) AS final_total_weight,
       COALESCE(SUM(g.actual_volume), 0) AS final_total_volume,
       COUNT(DISTINCT g.cargo_no)        AS cargo_ticket_cnt

LEFT JOIN migrated g ON b.container_no = g.final_container
WHERE b.dt = '2026-07-31' AND b.del_flag = 0
GROUP BY b.container_no;`
  },
  { id:'Q2', title:'Q2 海运进仓异常数据统计', level:'中等', stage:4, linked:[], tags:['异常监控','COUNT IF','退仓保留'],
    isFinal:true,
    desc:'统计每个客户的异常柜数：超量、全额退仓、空柜、延期入库。\n\n📌 关联基础题：Z4 + G4\n\n口径：退仓【保留】（与 Q1 相反），空柜=无匹配。',
    schema:'CREATE TABLE dwd_sea_container_full (\n  container_no VARCHAR(50),\n  cust_id VARCHAR(50),\n  book_weight DECIMAL(12,2),\n  book_volume DECIMAL(12,2),\n  old_plan_sail_date DATE,\n  dt VARCHAR(10),\n  del_flag INT\n);\n\nCREATE TABLE dwd_sea_goods_inbound_full (\n  cargo_no VARCHAR(50),\n  container_no VARCHAR(50),\n  inbound_time DATETIME,\n  actual_weight DECIMAL(12,2),\n  inbound_type VARCHAR(20),\n  data_status VARCHAR(20),\n  del_flag INT\n);',
    ref:`WITH valid_container AS (
  SELECT container_no, cust_id, book_weight, old_plan_sail_date
  FROM dwd_sea_container_full WHERE del_flag = 0 AND dt = '2026-07-31'
),
valid_inbound AS (
  SELECT * FROM dwd_sea_goods_inbound_full
  WHERE data_status = '有效' AND del_flag = 0
    AND inbound_time >= '2026-07-01' AND inbound_time < '2026-08-01'
),
container_stat AS (
  SELECT container_no, SUM(actual_weight) AS total_w,
         COUNT(1) AS inbound_cnt, MIN(inbound_time) AS first_time
  FROM valid_inbound GROUP BY container_no
)
SELECT v.cust_id,
       COUNT(1) AS total_container_cnt,
       COUNT(IF(c.total_w > v.book_weight, 1, NULL)) AS over_weight_cnt,
       COUNT(IF(c.total_w = 0, 1, NULL))             AS full_refund_cnt,
       COUNT(IF(c.inbound_cnt IS NULL, 1, NULL))     AS empty_cnt,
       COUNT(IF(c.first_time > CONCAT(v.old_plan_sail_date,' 23:59:59'), 1, NULL)) AS delay_inbound_cnt
FROM valid_container v
LEFT JOIN container_stat c ON v.container_no = c.container_no
GROUP BY v.cust_id;`

  { id:'Q3', title:'Q3 月度进仓时效分层排名', level:'中等', stage:4, linked:[], tags:['DENSE_RANK','时间计算','分组排名'],
    isFinal:true,
    desc:'按目的港+周分组，统计进仓耗时（小时）并排名。\n\n📌 关联基础题：Z5/Z6 + G5\n\n口径：完结=已配柜/已出运/已签收；并列不跳号。',
    schema:'CREATE TABLE dwd_sea_booking_full (\n  booking_id VARCHAR(50),\n  container_no VARCHAR(50),\n  dest_port VARCHAR(50),\n  container_status VARCHAR(20),\n  plan_sail_date DATE,\n  create_time DATETIME,\n  del_flag INT\n);\n\nCREATE TABLE dwd_sea_goods_inbound_full (\n  container_no VARCHAR(50),\n  inbound_time DATETIME,\n  data_status VARCHAR(20),\n  del_flag INT\n);',
    ref:`WITH finished_container AS (
  SELECT container_no, dest_port, create_time, plan_sail_date
  FROM dwd_sea_booking_full
  WHERE container_status IN ('已配柜','已出运','已签收')
    AND del_flag = 0
    AND plan_sail_date >= '2026-07-01' AND plan_sail_date < '2026-08-01'
),
last_inbound AS (
  SELECT container_no, MAX(inbound_time) AS last_time
  FROM dwd_sea_goods_inbound_full
  WHERE data_status = '有效' AND del_flag = 0
  GROUP BY container_no
),
inbound_hours AS (
  SELECT f.container_no, f.dest_port,
         CONCAT('2026-W', LPAD(WEEKOFYEAR(f.plan_sail_date), 2, '0')) AS stat_week,
         ROUND((UNIX_TIMESTAMP(l.last_time) - UNIX_TIMESTAMP(f.create_time)) / 3600, 1) AS inbound_hours

SELECT stat_week, dest_port, container_no, inbound_hours,

  { id:'Q4', title:'Q4 快照数据修正统计', level:'困难', stage:4, linked:[], tags:['分区快照','回溯','自连接','完成率'],
    isFinal:true,
    desc:'用 7-31 的最终快照状态修正 7 月每日历史统计。\n\n📌 关联基础题：Z7/Z8 + G8\n\n口径：历史取存在性 + 状态取最新快照 + 剔除"后来被删" + 防除零。',
    schema:'CREATE TABLE dwd_sea_booking_full (\n  booking_id VARCHAR(50),\n  container_no VARCHAR(50),\n  container_status VARCHAR(20),\n  dt VARCHAR(10),\n  del_flag INT\n);',
    ref:`WITH latest_snapshot AS (
  SELECT booking_id, container_no, del_flag
  FROM dwd_sea_booking_full WHERE dt = '2026-07-31'
)
SELECT d.dt,
       COUNT(1) AS total_cnt,
       SUM(IF(d.container_status IN ('已出运','已签收'), 1, 0)) AS finish_cnt,
       ROUND(SUM(IF(d.container_status IN ('已出运','已签收'),1,0)) / GREATEST(COUNT(1),1) * 100, 2) AS daily_complete_rate
FROM dwd_sea_booking_full d
JOIN latest_snapshot l ON d.booking_id = l.booking_id AND d.container_no = l.container_no
WHERE d.dt >= '2026-07-01' AND d.dt < '2026-08-01'
  AND d.del_flag = 0 AND l.del_flag = 0
GROUP BY d.dt ORDER BY d.dt;`
  },
  { id:'Q5', title:'Q5 客户拼柜质量综合评分', level:'困难', stage:4, linked:[], tags:['两阶段聚合','评分建模','数据倾斜'],
    isFinal:true,
    desc:'对客户计算拼柜质量综合评分。\n\n📌 关联基础题：G1/G2/G6/G7\n\n口径：拼柜≥2票，合规≤5票；评分公式 (1-空柜率)*40 + (1-超量率)*30 + 合规率*30。',
    schema:'CREATE TABLE dwd_sea_container_full (\n  container_no VARCHAR(50),\n  cust_id VARCHAR(50),\n  book_weight DECIMAL(12,2),\n  dt VARCHAR(10),\n  del_flag INT\n);\n\nCREATE TABLE dwd_sea_goods_inbound_full (\n  cargo_no VARCHAR(50),\n  container_no VARCHAR(50),\n  actual_weight DECIMAL(12,2),\n  data_status VARCHAR(20),\n  del_flag INT\n);',
    ref:`WITH container_fact AS (
  SELECT container_no,
         COUNT(DISTINCT cargo_no) AS ticket_cnt,
         SUM(actual_weight)       AS total_w
  FROM dwd_sea_goods_inbound_full
  WHERE data_status = '有效' AND del_flag = 0
  GROUP BY container_no
),
cust_metric AS (
  SELECT c.cust_id,
         COUNT(1) AS total_cnt,
         SUM(IF(f.ticket_cnt IS NULL, 1, 0))                    AS empty_cnt,
         SUM(IF(f.total_w > c.book_weight, 1, 0))               AS over_cnt,
         SUM(IF(f.ticket_cnt IS NOT NULL AND f.ticket_cnt <= 5, 1, 0)) AS compliance_cnt
  FROM dwd_sea_container_full c
  LEFT JOIN container_fact f ON c.container_no = f.container_no
  WHERE c.del_flag = 0 AND c.dt = '2026-09-30'
  GROUP BY c.cust_id
)
SELECT cust_id,
       ROUND((1 - empty_cnt/GREATEST(total_cnt,1)) * 40
           + (1 - over_cnt/GREATEST(total_cnt - empty_cnt, 1)) * 30
           + compliance_cnt/GREATEST(total_cnt, 1) * 30, 2) AS score
FROM cust_metric;`
  }
];

// ============= 状态 =============
let questions = load(STORE) || SAMPLE;
let progress = load(PROGRESS) || {};
let curStage = 0;
let curIdx = 0;
let curMode = 'stage';

function load(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function save(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
function persistQ(){ save(STORE, questions); }
function persistP(){ save(PROGRESS, progress); }

// ============= 渲染 =============
function renderTables(){
  const el = document.getElementById('tablesArea');
  el.innerHTML = SAMPLE_TABLES.map(t=>`
    <div class="table-card">
      <div class="table-name">${t.name} <span class="badge">${t.alias}</span></div>
      <div class="table-desc">${t.comment}</div>
      <table class="field-table">
        <thead><tr><th>字段</th><th>类型</th><th>说明</th></tr></thead>
        <tbody>${t.fields.map(f=>`<tr><td>${f.n}</td><td class="type">${f.t}</td><td class="comment">${f.c}</td></tr>`).join('')}</tbody>
      </table>
      <div class="sample"><div class="label">示例数据</div><pre>${t.sample}</pre></div>
    </div>
  `).join('');
}

function renderStageBar(){
  const total = questions.length;
  const done = questions.filter(q => progress[q.id] === '会').length;
  const el = document.getElementById('stageBar');
  el.innerHTML = STAGES.map(s=>{
    const list = questions.filter(q=>q.stage===s.id);
    const stageDone = list.filter(q=>progress[q.id]==='会').length;
    const active = curMode==='stage' && curStage===s.id;
    return `<div class="stage-pill ${active?'active':''}" data-stage="${s.id}" style="${active?`border-color:${s.color}`:''}">
      <span style="width:8px;height:8px;border-radius:50%;background:${s.color}"></span>
      ${s.name}<span class="cnt">${stageDone}/${list.length}</span>
    </div>`;
  }).join('') + `
    <div class="progress-wrap">
      <div class="progress-label">总进度</div>
      <div class="progress-bar"><div class="fill" style="width:${(done/total*100).toFixed(1)}%"></div></div>
      <div class="progress-num">${done}/${total}</div>
    </div>
  `;
  el.querySelectorAll('.stage-pill').forEach(p=>p.onclick=()=>{
    curStage = parseInt(p.dataset.stage);
    curIdx = 0;
    renderAll();
  });
}

function filteredQuestions(){
  if(curMode==='free') return questions.map((q,i)=>({q,i}));
  return questions.filter(q=>q.stage===curStage).map((q,i)=>({q,i}));
}

function renderList(){
  const el = document.getElementById('qlistBody');
  const list = filteredQuestions();
  document.getElementById('qlistMeta').textContent = `${list.length} 题`;

  if(list.length===0){ el.innerHTML='<div class="empty"><p>该阶段暂无题</p></div>'; return; }
  el.innerHTML = list.map(({q},idx)=>{
    const p = progress[q.id];
    const dot = p==='会'?'<span style="color:var(--ok)">✓</span>':(p?`<span style="color:var(--warn)">${p}</span>`:'');
    const isFinal = q.isFinal?' 🏆':'';
    return `<div class="qitem ${idx===curIdx?'active':''} ${p?'done':''}">
      <div class="top"><span class="qid">${q.id}</span><span class="qtitle">${q.title}${isFinal}</span>${dot}</div>
      <div class="meta">
        <span class="badge ${q.level}">${q.level}</span>
        ${(q.tags||[]).slice(0,2).map(t=>`<span>#${t}</span>`).join('')}
        ${q.linked && q.linked.length?`<span class="linked">→ ${q.linked.join(',')}</span>`:''}
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.qitem').forEach((d,idx)=>{
    d.onclick = ()=>{ curIdx = idx; renderList(); renderDetail(); };
  });
}

function renderDetail(){
  const pane = document.getElementById('qdetailPane');
  const list = filteredQuestions();
  if(list.length===0 || !list[curIdx]){
    pane.innerHTML = '<div class="empty"><div class="big">👈</div><p>左侧选择阶段</p></div>';
    return;
  }
  const {q} = list[curIdx];
  const p = progress[q.id];
  const isFinal = q.isFinal;

  pane.innerHTML = `
    <div class="qdetail-head">
      <div class="left">
        <div class="qid">${q.id} · ${STAGES[q.stage].name}</div>
        <div class="qt">${q.title}</div>
        <div class="links">
          <span class="badge ${q.level}">${q.level}</span>
          ${(q.tags||[]).map(t=>`<span class="tag">#${t}</span>`).join('')}
          ${q.linked && q.linked.length?`<span class="tag" style="background:#1a1530;border-color:#3a2a55">关联 ${q.linked.join(', ')}</span>`:''}
          ${isFinal?'<span class="tag" style="background:#3a1c1c;border-color:#f85149">🏆 终极题</span>':''}
          ${p==='会'?'<span class="tag" style="background:#1a3a23;border-color:var(--ok2)">✓ 已掌握</span>':p?`<span class="tag" style="background:#3a2a13">${p}</span>`:''}
        </div>
      </div>
    </div>
    <div class="qdetail-body">
      <div class="qdesc">${q.desc}</div>
      <div class="qschema"><div class="label">表结构</div><pre>${q.schema || '（无）'}</pre></div>
      <div class="qeditor-wrap">
        <div class="lbl">✏️ 你的答案 <span style="color:var(--muted)">SELECT ...</span></div>
        <textarea id="answer" placeholder="在这里写你的 SQL...">${load('answer-'+q.id) || ''}</textarea>
      </div>
    </div>
    <div class="qactions">
      <button class="btn" data-rate="会">✓ 掌握</button>
      <button class="btn" data-rate="模糊">? 模糊</button>
      <button class="btn" data-rate="不会">✗ 不会</button>
      <button class="btn ghost" id="resetRate">重置</button>
      <span style="flex:1"></span>
      <button class="btn" id="toggleRef">📋 展开参考答案</button>
      <button class="btn" id="prevBtn">←</button>
      <button class="btn" id="nextBtn">→</button>
    </div>
    <div style="padding:0 18px 14px"><div class="qref" id="qref"><pre>${q.ref||''}</pre></div></div>
  `;

  document.getElementById('answer').addEventListener('input', e=>{
    save('answer-'+q.id, e.target.value);
  });
  pane.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{
    const v = b.dataset.rate;
    if(progress[q.id]===v){ delete progress[q.id]; } else { progress[q.id]=v; }
    persistP();
    renderStageBar(); renderList(); renderDetail();
    toast(v==='会'?'已标记为掌握':'已标记为 '+v, v==='会'?'ok':'');
  });
  document.getElementById('resetRate').onclick = ()=>{
    delete progress[q.id];
    persistP();
    renderStageBar(); renderList(); renderDetail();
  };
  document.getElementById('toggleRef').onclick = ()=>{
    const r = document.getElementById('qref');
    const show = r.classList.toggle('show');
    document.getElementById('toggleRef').textContent = show?'🙈 收起参考答案':'📋 展开参考答案';
  };
  document.getElementById('prevBtn').onclick = ()=>{ if(curIdx>0){curIdx--; renderList(); renderDetail();} };
  document.getElementById('nextBtn').onclick = ()=>{ if(curIdx<list.length-1){curIdx++; renderList(); renderDetail();} };
}

function renderAll(){
  renderStageBar();
  renderList();
  renderDetail();
}

document.querySelectorAll('#modeSwitch button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#modeSwitch button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  curMode = b.dataset.mode;
  curIdx = 0;
  renderAll();
});

let toastTimer;
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type||'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

renderTables();
renderAll();
</script>
</body>
</html>
