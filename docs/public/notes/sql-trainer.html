<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL 闯关 · 海运数仓 37 题</title>
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --line:#e5e3dc; --ink:#2c2c2a; --sub:#888780;
  --blue:#185fa5; --green:#3b6d11; --green-l:#e8f2da; --yellow:#ef9f27; --yellow-l:#fdf3e0;
  --red:#e24b4a; --red-l:#fdeaea; --mono:'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.7 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;padding-bottom:60px}
.wrap{max-width:1280px;margin:0 auto;padding:20px 18px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:19px}
.hsub{color:var(--sub);font-size:12px}
.hbtns{margin-left:auto;display:flex;gap:8px}
.hbtn{padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;color:var(--ink)}
.hbtn:hover{background:#f4f2ec;border-color:#d5d2c8}
.statbox{background:var(--card);border-radius:14px;padding:12px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:16px}
.statrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
.statrow b{font-size:15px;color:var(--ink)}
.dist{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);margin-top:9px}
.dist i{height:100%}
.legend{display:flex;gap:14px;margin-top:7px;font-size:11.5px;color:var(--sub);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.main{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}}
/* 左栏 */
.leftcol{display:flex;flex-direction:column;gap:12px;position:sticky;top:14px}
@media(max-width:900px){.leftcol{position:static}}
.stagecard{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden}
.stagecard .sc-head{padding:12px 14px 4px;font-weight:700;font-size:13.5px}
.searchbox{padding:10px 12px;border-bottom:1px solid var(--line)}
.searchbox input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#faf9f5;outline:none}
.searchbox input:focus{border-color:var(--blue)}
.slist{max-height:46vh;overflow:auto;padding:6px}
.qitem{padding:8px 10px;border-radius:9px;cursor:pointer;display:block}
.qitem:hover{background:#f4f2ec}
.qitem.active{background:#eef3f9}
.qitem .t{display:flex;align-items:center;gap:7px;font-size:13px}
.qitem .qid{font-family:var(--mono);font-size:11px;color:var(--blue);font-weight:700;flex:none}
.qitem .name{flex:1}
.qitem .st{flex:none;font-size:11px}
.qitem .meta{margin-top:2px;padding-left:38px;font-size:11px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap}
.qitem .meta .lk{color:#8a6d1d}
/* 阶段列表 */
.stagelist{display:flex;flex-direction:column;gap:8px;padding:12px}
.stageitem{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;background:#fff}
.stageitem:hover{background:#faf9f5}
.stageitem.active{border-color:var(--blue);background:#f0f5fb}
.stageitem.locked{opacity:.62}
.stageitem .row1{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.stageitem .dot{width:9px;height:9px;border-radius:50%;flex:none}
.stageitem .pct{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:400}
.stageitem .bar{height:5px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden}
.stageitem .bar i{display:block;height:100%;border-radius:3px}
.stageitem .desc{font-size:11px;color:var(--sub);margin-top:4px}
/* 右栏：做题面板 */
.qpanel{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:18px 20px;min-height:420px}
.qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qidbig{font-family:var(--mono);font-weight:800;color:var(--blue);font-size:15px}
.qtitle{font-size:16px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;padding:2px 9px;border-radius:20px;background:#f0eee7;color:var(--sub)}
.chip.lvl-简单{background:var(--green-l);color:var(--green)}
.chip.lvl-中等{background:var(--yellow-l);color:#9a6207}
.chip.lvl-困难{background:var(--red-l);color:var(--red)}
.chip.link{background:#e8f0fa;color:var(--blue);cursor:pointer}
.chip.link:hover{background:#d8e6f7}
.chip.final{background:var(--red-l);color:var(--red);font-weight:700}
.qdesc{margin:12px 0;font-size:13.5px}
.caliber{background:var(--yellow-l);border-left:3px solid var(--yellow);border-radius:0 9px 9px 0;padding:8px 12px;font-size:12.5px;color:#6b4a08;margin:10px 0}
.editorwrap{margin-top:12px}
.edlabel{font-size:12px;color:var(--sub);margin-bottom:5px;display:flex;align-items:center;gap:10px}
.edlabel .kks{font-size:11px;color:#b4b2a9}
textarea#answer{width:100%;min-height:170px;resize:vertical;font-family:var(--mono);font-size:12.8px;line-height:1.65;padding:12px;border:1.5px solid var(--line);border-radius:11px;background:#fbfaf7;color:var(--ink);outline:none}
textarea#answer:focus{border-color:var(--blue);background:#fff}
.checkarea{margin-top:10px}
.checkitem{font-size:12.5px;padding:3px 0}
.checkitem.ok{color:var(--green)}
.checkitem.miss{color:#9a6207}
.checkall{margin-top:6px;font-size:13px;font-weight:700;color:var(--green)}
.hintbox{margin-top:10px;background:#eef3f9;border-left:3px solid var(--blue);border-radius:0 9px 9px 0;padding:9px 12px;font-size:12.8px;color:#274b73}
.stepsbox{margin-top:10px;border:1px dashed #c9c5ba;border-radius:11px;padding:10px 14px;font-size:12.8px}
.stepsbox .st{padding:3px 0;color:#3c3a35}
.stepsbox .hd{font-weight:700;font-size:12px;color:var(--sub);margin-bottom:4px}
.refbox{margin-top:10px;background:#faf9f5;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.refbox .rb-hd{padding:8px 14px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);font-weight:600}
.refbox .compare{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:700px){.refbox .compare{grid-template-columns:1fr}}
.refbox .cmp{padding:12px 14px}
.refbox .cmp+.cmp{border-left:1px solid var(--line)}
@media(max-width:700px){.refbox .cmp+.cmp{border-left:none;border-top:1px solid var(--line)}}
.refbox .cmp .clabel{font-size:11px;color:var(--sub);margin-bottom:6px;font-weight:600}
.refbox pre{font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.refbox .mine{color:#5a5850}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.abtn{padding:8px 15px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;color:var(--ink)}
.abtn:hover{background:#f4f2ec}
.abtn.good{background:var(--green-l);border-color:#c5dba2;color:var(--green);font-weight:600}
.abtn.mid{background:var(--yellow-l);border-color:#ecd3a2;color:#9a6207;font-weight:600}
.abtn.bad{background:var(--red-l);border-color:#f2c4c4;color:var(--red);font-weight:600}
.abtn.on{outline:2px solid var(--blue);outline-offset:1px}
.abtn:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
.ratehint{font-size:11.5px;color:var(--sub)}
/* 表结构侧滑 */
.mask{position:fixed;inset:0;background:rgba(30,28,22,.35);opacity:0;pointer-events:none;transition:.25s;z-index:50}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-480px;width:min(460px,94vw);height:100%;background:var(--bg);z-index:51;transition:right .28s;overflow:auto;box-shadow:-4px 0 24px rgba(0,0,0,.12);padding:16px}
.drawer.on{right:0}
.drawer h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center}
.drawer .close{margin-left:auto;cursor:pointer;border:none;background:none;font-size:20px;color:var(--sub)}
.ttabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ttab{padding:5px 11px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:12px;cursor:pointer;font-family:var(--mono)}
.ttab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tcard{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tname{font-family:var(--mono);font-weight:700;font-size:13.5px;color:var(--blue)}
.tdesc{font-size:12px;color:var(--sub);margin:2px 0 8px}
.ftable{width:100%;border-collapse:collapse;font-size:12px}
.ftable th{text-align:left;color:var(--sub);font-weight:600;padding:4px 6px;border-bottom:1.5px solid var(--line)}
.ftable td{padding:4px 6px;border-bottom:1px solid #f0eee7;vertical-align:top}
.ftable td.f{font-family:var(--mono);font-size:11.5px}
.ftable td.ty{color:#8a6d1d;font-family:var(--mono);font-size:11px;white-space:nowrap}
.tsample{margin-top:10px;background:#fbfaf7;border-radius:9px;padding:9px 11px}
.tsample .lb{font-size:11px;color:var(--sub);margin-bottom:4px}
.tsample pre{font-family:var(--mono);font-size:11px;line-height:1.6;white-space:pre-wrap}
/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#2c2c2a;color:#fff;padding:9px 20px;border-radius:22px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green)}
.empty{padding:60px 20px;text-align:center;color:var(--sub)}
.empty .big{font-size:38px;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚔️ SQL 闯关 <span class="hsub">海运数仓 · 37 题 · 5 关</span> <span id="rTitle" style="font-size:14px"></span></h1>
    <div class="hbtns">
      <button class="hbtn" onclick="randomQ()">🎲 随机一题</button>
      <button class="hbtn" onclick="openWrongMode()">🔁 错题重刷 <span id="wrongCnt"></span></button>
      <button class="hbtn" onclick="openDrawer()">📚 表结构速查</button>
    </div>
  </header>

  <div class="statbox">
    <div class="statrow">
      <span>总进度 <b id="sDone">0</b>/37</span>
      <span>😎 掌握 <b id="sGood" style="color:var(--green)">0</b></span>
      <span>🤔 模糊 <b id="sMid" style="color:#9a6207">0</b></span>
      <span>😵 不会 <b id="sBad" style="color:var(--red)">0</b></span>
      <span id="sMode" style="margin-left:auto"></span>
    </div>
    <div class="dist" id="distBar"></div>
    <div class="legend">
      <span><i style="background:var(--green)"></i>掌握</span>
      <span><i style="background:var(--yellow)"></i>模糊</span>
      <span><i style="background:var(--red)"></i>不会</span>
      <span><i style="background:var(--line)"></i>未做</span>
    </div>
  </div>

  <div class="main">
    <div class="leftcol">
      <div class="stagecard">
        <div class="sc-head">🗺 闯关地图</div>
        <div class="stagelist" id="stageList"></div>
      </div>
      <div class="stagecard">
        <div class="searchbox"><input id="searchInput" placeholder="🔍 搜题目 / 标签 / 考点…"></div>
        <div class="slist" id="qlist"></div>
      </div>
    </div>
    <div class="qpanel" id="qpanel"></div>
  </div>
</div>

<div class="mask" id="mask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <h3>📚 表结构速查<button class="close" onclick="closeDrawer()">×</button></h3>
  <div class="ttabs" id="ttabs"></div>
  <div id="tbody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STAGES = [
  { id:0, name:'基础闯关', color:'#3fb950', desc:'SQL 基本功' },
  { id:1, name:'初级闯关', color:'#39c5cf', desc:'JOIN + GROUP BY' },
  { id:2, name:'中级闯关', color:'#d29922', desc:'窗口函数 + 时间' },
  { id:3, name:'高级闯关', color:'#bc8cff', desc:'多CTE + 倾斜处理' },
  { id:4, name:'终极闯关', color:'#f85149', desc:'海运 5 大综合题' }
];
const SAMPLE_TABLES = [
  { name:'dwd_sea_container_full', alias:'柜清单快照', comment:'每个柜按 dt 的全量快照',
    fields:[
      {n:'container_no', t:'VARCHAR(50)', c:'柜号（主键）'},
      {n:'cust_id', t:'VARCHAR(50)', c:'客户ID'},
      {n:'dest_port', t:'VARCHAR(50)', c:'目的港'},
      {n:'book_weight', t:'DECIMAL(12,2)', c:'订舱重量'},
      {n:'book_volume', t:'DECIMAL(12,2)', c:'订舱体积'},
      {n:'old_plan_sail_date', t:'DATE', c:'计划开船日'},
      {n:'dt', t:'VARCHAR(10)', c:'快照日期 yyyy-MM-dd'},
      {n:'del_flag', t:'INT', c:'删除标记 0/1'}
    ],
    sample:"('CTN001','C001','上海港', 20.0, 30.0, '2026-07-10','2026-07-31',0)\n('CTN003','C002','宁波港', 15.0, 20.0, '2026-07-10','2026-07-31',0)\n('CTN005','C003','深圳港', 10.0, 15.0, '2026-07-12','2026-07-31',0)"
  },
  { name:'dwd_sea_goods_inbound_full', alias:'入库明细', comment:'每条入库操作一条记录（事实）',
    fields:[
      {n:'cargo_no', t:'VARCHAR(50)', c:'票号'},
      {n:'container_no', t:'VARCHAR(50)', c:'柜号'},
      {n:'inbound_time', t:'DATETIME', c:'入库时间'},
      {n:'actual_weight', t:'DECIMAL(12,2)', c:'实际重量'},
      {n:'actual_volume', t:'DECIMAL(12,2)', c:'实际体积'},
      {n:'inbound_type', t:'VARCHAR(20)', c:'正常/退仓'},
      {n:'data_status', t:'VARCHAR(20)', c:'有效/无效'},
      {n:'del_flag', t:'INT', c:'0/1'}
    ],
    sample:"('BL001','CTN001','2026-07-05 10:00', 8.0, 12.0, '正常','有效',0)\n('BL004','CTN003','2026-07-10 14:00', 9.0, 14.0, '正常','有效',0)\n('BL005','CTN004','2026-07-12 16:00', 9.0, 14.0, '退仓','有效',0)"
  },
  { name:'dwd_sea_container_change', alias:'换柜流水', comment:'缓慢变化维：每次换柜留痕',
    fields:[
      {n:'cargo_no', t:'VARCHAR(50)', c:'票号'},
      {n:'old_container_no', t:'VARCHAR(50)', c:'旧柜号'},
      {n:'new_container_no', t:'VARCHAR(50)', c:'新柜号'},
      {n:'change_time', t:'DATETIME', c:'换柜时间'}
    ],
    sample:"('BL004','CTN003','CTN004','2026-07-11 08:00:00')"
  },
  { name:'dwd_sea_booking_full', alias:'订舱快照', comment:'订舱每日全量快照（dt分区）',
    fields:[
      {n:'booking_id', t:'VARCHAR(50)', c:'订舱ID'},
      {n:'container_no', t:'VARCHAR(50)', c:'柜号'},
      {n:'cust_id', t:'VARCHAR(50)', c:'客户ID'},
      {n:'container_status', t:'VARCHAR(20)', c:'已配柜/已出运/已签收'},
      {n:'plan_sail_date', t:'DATE', c:'计划开船日'},
      {n:'create_time', t:'DATETIME', c:'创建时间'},
      {n:'dt', t:'VARCHAR(10)', c:'快照日期'},
      {n:'del_flag', t:'INT', c:'0/1'}
    ],
    sample:"('BK001','CTN001','C001','已签收','2026-07-10','2026-07-01 09:00','2026-07-31',0)\n('BK002','CTN002','C001','已配柜','2026-07-12','2026-07-01 09:00','2026-07-31',1)\n('BK003','CTN003','C002','已签收','2026-07-10','2026-07-01 09:00','2026-07-31',0)"
  },
  { name:'dim_cust', alias:'客户主表', comment:'客户维度',
    fields:[
      {n:'cust_id', t:'VARCHAR(50)', c:'客户ID（主键）'},
      {n:'cust_name', t:'VARCHAR(100)', c:'客户名称'}
    ],
    sample:"('C001','甲客户')\n('C002','乙客户')\n('C003','丙客户')"
  }
];
const SAMPLE = [
  // ===== Stage 0 基础闯关 =====
  { id:'B1', title:'查询所有客户的姓名和客户ID', level:'简单', stage:0, linked:[], tags:['SELECT'],
    desc:'从 dim_cust 表查询所有客户的 cust_id 和 cust_name。',
    schema:'CREATE TABLE dim_cust (\n  cust_id VARCHAR(50),\n  cust_name VARCHAR(100)\n);',
    ref:"SELECT cust_id, cust_name\nFROM dim_cust;"
  },
  { id:'B2', title:'查询客户信息，按 cust_id 降序', level:'简单', stage:0, linked:[], tags:['ORDER BY'],
    desc:'按 cust_id 倒序展示所有客户。',
    schema:'CREATE TABLE dim_cust (\n  cust_id VARCHAR(50),\n  cust_name VARCHAR(100)\n);',
    ref:"SELECT cust_id, cust_name\nFROM dim_cust\nORDER BY cust_id DESC;"
  },
  { id:'B3', title:'查询入库重量大于 10 的所有入库记录', level:'简单', stage:0, linked:[], tags:['WHERE'],
    desc:'从 dwd_sea_goods_inbound_full 查 actual_weight > 10 的记录，显示 cargo_no、container_no、actual_weight。',
    schema:'CREATE TABLE dwd_sea_goods_inbound_full (\n  cargo_no VARCHAR(50),\n  container_no VARCHAR(50),\n  actual_weight DECIMAL(12,2),\n  data_status VARCHAR(20),\n  del_flag INT\n);',
    ref:"SELECT cargo_no, container_no, actual_weight\nFROM dwd_sea_goods_inbound_full\nWHERE actual_weight > 10\n  AND data_status = '有效' AND del_flag = 0;"
  },
  { id:'B4', title:'查询 2026-07-10 及之后入库的货物', level:'简单', stage:0, linked:[], tags:['WHERE','日期'],
    desc:'从入库明细表查 inbound_time >= 2026-07-10 的所有记录。',
    schema:'CREATE TABLE dwd_sea_goods_inbound_full (\n  cargo_no VARCHAR(50),\n  container_no VARCHAR(50),\n  inbound_time DATETIME,\n  data_status VARCHAR(20)\n);',
    ref:"SELECT cargo_no, container_no, inbound_time\nFROM dwd_sea_goods_inbound_full\nWHERE inbound_time >= '2026-07-10'\n  AND data_status = '有效';"
  },
  { id:'B5', title:'统计每个柜的入库票数', level:'简单', stage:0, linked:['Q1'], tags:['COUNT','GROUP BY'],
    desc:'按 container_no 统计入库票数（去重 cargo_no）。',
    schema:'CREATE TABLE dwd_sea_goods_inbound_full (\n  cargo_no VARCHAR(50),\n  container_no VARCHAR(50),\n  data_status VARCHAR(20),\n  del_flag INT\n);',
    ref:"SELECT container_no, COUNT(DISTINCT cargo_no) AS ticket_cnt\nFROM dwd_sea_goods_inbound_full\nWHERE data_status = '有效' AND del_flag = 0\nGROUP BY container_no;"
  },
  { id:'B6', title:'统计每个客户的柜数', level:'简单', stage:0, linked:[], tags:['GROUP BY','COUNT'],
    desc:'按 cust_id 统计柜清单里每个客户的柜数。',
    schema:'CREATE TABLE dwd_sea_container_full (\n  container_no VARCHAR(50),\n  cust_id VARCHAR(50),\n  dt VARCHAR(10),\n  del_flag INT\n);',
    ref:"SELECT cust_id, COUNT(1) AS container_cnt\nFROM dwd_sea_container_full\nWHERE dt = '2026-07-31' AND del_flag = 0\nGROUP BY cust_id;"
  },
  { id:'B7', title:'查询每个柜的入库总重量', level:'简单', stage:0, linked:['Q1','Q5'], tags:['SUM','GROUP BY'],
    desc:'按 container_no 汇总 actual_weight，显示柜号和总重量。',
    schema:'CREATE TABLE dwd_sea_goods_inbound_full (\n  cargo_no VARCHAR(50),\n  container_no VARCHAR(50),\n  actual_weight DECIMAL(12,2),\n  data_status VARCHAR(20),\n  del_flag INT\n);',
    ref:"SELECT container_no, SUM(actual_weight) AS total_w\nFROM dwd_sea_goods_inbound_full\nWHERE data_status = '有效' AND del_flag = 0\nGROUP BY container_no;"
  },
  { id:'B8', title:'查询每个客户的订舱关联总重量', level:'简单', stage:0, linked:[], tags:['JOIN','SUM'],
    desc:'JOIN 柜清单和入库明细，统计每个客户订舱关联的总重量。',
    schema:'-- 见顶部 dwd_sea_container_full、dwd_sea_goods_inbound_full 表',

  // ===== Stage 3 高级闯关 =====
  { id:'G1', title:'两阶段聚合：先按柜聚合，再按客户聚合', level:'困难', stage:3, linked:['Q5'], tags:['两阶段聚合','CTE'],

  { id:'G3', title:'写一个 3 个 CTE 串联的查询', level:'困难', stage:3, linked:['Q1'], tags:['多层CTE'],

    ref:"WITH container_map AS (\n  SELECT cargo_no, new_container_no AS latest_no,\n         ROW_NUMBER() OVER (PARTITION BY cargo_no ORDER BY change_time DESC) AS rn\n  FROM dwd_sea_container_change\n),\nvalid_inbound AS (\n  SELECT * FROM dwd_sea_goods_inbound_full\n  WHERE data_status = '有效' AND del_flag = 0 AND inbound_type <> '退仓'\n    AND inbound_time >= '2026-07-01' AND inbound_time < '2026-08-01'\n),\nmigrated AS (\n  SELECT COALESCE(m.latest_no, i.container_no) AS final_container,\n         i.cargo_no, i.actual_weight, i.actual_volume\n  FROM valid_inbound i\n  LEFT JOIN container_map m ON i.cargo_no = m.cargo_no AND m.rn = 1\n)\nSELECT b.container_no, COUNT(DISTINCT g.cargo_no) AS ticket_cnt\nFROM dwd_sea_container_full b\nLEFT JOIN migrated g ON b.container_no = g.final_container\nWHERE b.dt = '2026-07-31' AND b.del_flag = 0\nGROUP BY b.container_no;"

  { id:'G4', title:'退仓口径辨析：Q1 剔除 vs Q2 保留', level:'困难', stage:3, linked:['Q1','Q2'], tags:['口径辨析'],

  { id:'G5', title:'用 CONCAT + WEEKOFYEAR + LPAD 拼成周标签', level:'中等', stage:3, linked:['Q3'], tags:['CONCAT','WEEKOFYEAR','LPAD'],

  { id:'G6', title:'写评分公式：(1-空柜率)*40 + (1-超量率)*30 + 合规率*30', level:'困难', stage:3, linked:['Q5'], tags:['评分建模'],

  { id:'G8', title:'写"历史快照×最新快照"自连接完成率查询', level:'困难', stage:3, linked:['Q4'], tags:['自连接','回溯','完成率'],

  // ===== Stage 4 终极闯关 =====
  { id:'Q1', title:'Q1 换柜数据精准统计', level:'简单', stage:4, linked:[], tags:['换柜','补0','ROW_NUMBER'],
    isFinal:true,
    desc:'货物换柜后，旧柜数据残留在入库明细里。统计每个柜的最终总重量、总体积、票数。\n\n📌 关联基础题：J1/J2/J3/J4 + Z1/Z2/Z3 + G3\n\n口径：7月入库 / 有效 / 剔退仓 / 换柜按最新柜号 / 无入库补0',
    schema:'CREATE TABLE dwd_sea_container_full (\n  container_no VARCHAR(50),\n  cust_id VARCHAR(50),\n  dest_port VARCHAR(50),\n  book_weight DECIMAL(12,2),\n  book_volume DECIMAL(12,2),\n  dt VARCHAR(10),\n  del_flag INT\n);\n\nCREATE TABLE dwd_sea_goods_inbound_full (\n  cargo_no VARCHAR(50),\n  container_no VARCHAR(50),\n  inbound_time DATETIME,\n  actual_weight DECIMAL(12,2),\n  actual_volume DECIMAL(12,2),\n  inbound_type VARCHAR(20),\n  data_status VARCHAR(20),\n  del_flag INT\n);\n\nCREATE TABLE dwd_sea_container_change (\n  cargo_no VARCHAR(50),\n  old_container_no VARCHAR(50),\n  new_container_no VARCHAR(50),\n  change_time DATETIME\n);',
    ref:`WITH container_map AS (
  SELECT cargo_no, new_container_no AS latest_no,
         ROW_NUMBER() OVER (PARTITION BY cargo_no ORDER BY change_time DESC) AS rn
  FROM dwd_sea_container_change
),
valid_inbound AS (
  SELECT * FROM dwd_sea_goods_inbound_full
  WHERE data_status = '有效' AND del_flag = 0
    AND inbound_type <> '退仓'
    AND inbound_time >= '2026-07-01' AND inbound_time < '2026-08-01'
),
migrated AS (
  SELECT COALESCE(m.latest_no, i.container_no) AS final_container,
         i.cargo_no, i.actual_weight, i.actual_volume
  FROM valid_inbound i
  LEFT JOIN container_map m ON i.cargo_no = m.cargo_no AND m.rn = 1
)
SELECT b.container_no,
       COALESCE(SUM(g.actual_weight), 0) AS final_total_weight,
       COALESCE(SUM(g.actual_volume), 0) AS final_total_volume,
       COUNT(DISTINCT g.cargo_no)        AS cargo_ticket_cnt
FROM dwd_sea_container_full b
LEFT JOIN migrated g ON b.container_no = g.final_container
WHERE b.dt = '2026-07-31' AND b.del_flag = 0
GROUP BY b.container_no;`
  },
  { id:'Q2', title:'Q2 海运进仓异常数据统计', level:'中等', stage:4, linked:[], tags:['异常监控','COUNT IF','退仓保留'],
    isFinal:true,
    desc:'统计每个客户的异常柜数：超量、全额退仓、空柜、延期入库。\n\n📌 关联基础题：Z4 + G4\n\n口径：退仓【保留】（与 Q1 相反），空柜=无匹配。',
    schema:'CREATE TABLE dwd_sea_container_full (\n  container_no VARCHAR(50),\n  cust_id VARCHAR(50),\n  book_weight DECIMAL(12,2),\n  book_volume DECIMAL(12,2),\n  old_plan_sail_date DATE,\n  dt VARCHAR(10),\n  del_flag INT\n);\n\nCREATE TABLE dwd_sea_goods_inbound_full (\n  cargo_no VARCHAR(50),\n  container_no VARCHAR(50),\n  inbound_time DATETIME,\n  actual_weight DECIMAL(12,2),\n  inbound_type VARCHAR(20),\n  data_status VARCHAR(20),\n  del_flag INT\n);',
    ref:`WITH valid_container AS (
  SELECT container_no, cust_id, book_weight, old_plan_sail_date
  FROM dwd_sea_container_full WHERE del_flag = 0 AND dt = '2026-07-31'
),
valid_inbound AS (
  SELECT * FROM dwd_sea_goods_inbound_full
  WHERE data_status = '有效' AND del_flag = 0
    AND inbound_time >= '2026-07-01' AND inbound_time < '2026-08-01'
),
container_stat AS (
  SELECT container_no, SUM(actual_weight) AS total_w,
         COUNT(1) AS inbound_cnt, MIN(inbound_time) AS first_time
  FROM valid_inbound GROUP BY container_no
)
SELECT v.cust_id,
       COUNT(1) AS total_container_cnt,
       COUNT(IF(c.total_w > v.book_weight, 1, NULL)) AS over_weight_cnt,
       COUNT(IF(c.total_w = 0, 1, NULL))             AS full_refund_cnt,
       COUNT(IF(c.inbound_cnt IS NULL, 1, NULL))     AS empty_cnt,
       COUNT(IF(c.first_time > CONCAT(v.old_plan_sail_date,' 23:59:59'), 1, NULL)) AS delay_inbound_cnt
FROM valid_container v
LEFT JOIN container_stat c ON v.container_no = c.container_no
GROUP BY v.cust_id;`
  },
  { id:'Q3', title:'Q3 月度进仓时效分层排名', level:'中等', stage:4, linked:[], tags:['DENSE_RANK','时间计算','分组排名'],

    schema:'CREATE TABLE dwd_sea_booking_full (\n  booking_id VARCHAR(50),\n  container_no VARCHAR(50),\n  dest_port VARCHAR(50),\n  container_status VARCHAR(20),\n  plan_sail_date DATE,\n  create_time DATETIME,\n  del_flag INT\n);\n\nCREATE TABLE dwd_sea_goods_inbound_full (\n  container_no VARCHAR(50),\n  inbound_time DATETIME,\n  data_status VARCHAR(20),\n  del_flag INT\n);',
    ref:`WITH finished_container AS (
  SELECT container_no, dest_port, create_time, plan_sail_date
  FROM dwd_sea_booking_full
  WHERE container_status IN ('已配柜','已出运','已签收')
    AND del_flag = 0
    AND plan_sail_date >= '2026-07-01' AND plan_sail_date < '2026-08-01'
),
last_inbound AS (
  SELECT container_no, MAX(inbound_time) AS last_time
  FROM dwd_sea_goods_inbound_full
  WHERE data_status = '有效' AND del_flag = 0
  GROUP BY container_no
),
inbound_hours AS (
  SELECT f.container_no, f.dest_port,
         CONCAT('2026-W', LPAD(WEEKOFYEAR(f.plan_sail_date), 2, '0')) AS stat_week,
         ROUND((UNIX_TIMESTAMP(l.last_time) - UNIX_TIMESTAMP(f.create_time)) / 3600, 1) AS inbound_hours
  FROM finished_container f
  LEFT JOIN last_inbound l ON f.container_no = l.container_no
)
SELECT stat_week, dest_port, container_no, inbound_hours,
       DENSE_RANK() OVER (PARTITION BY dest_port, stat_week ORDER BY inbound_hours ASC) AS port_week_rank
FROM inbound_hours;`

    ref:`WITH latest_snapshot AS (
  SELECT booking_id, container_no, del_flag
  FROM dwd_sea_booking_full WHERE dt = '2026-07-31'
)
SELECT d.dt,
       COUNT(1) AS total_cnt,
       SUM(IF(d.container_status IN ('已出运','已签收'), 1, 0)) AS finish_cnt,
       ROUND(SUM(IF(d.container_status IN ('已出运','已签收'),1,0)) / GREATEST(COUNT(1),1) * 100, 2) AS daily_complete_rate
FROM dwd_sea_booking_full d
JOIN latest_snapshot l ON d.booking_id = l.booking_id AND d.container_no = l.container_no
WHERE d.dt >= '2026-07-01' AND d.dt < '2026-08-01'
  AND d.del_flag = 0 AND l.del_flag = 0
GROUP BY d.dt ORDER BY d.dt;`
  },
  { id:'Q5', title:'Q5 客户拼柜质量综合评分', level:'困难', stage:4, linked:[], tags:['两阶段聚合','评分建模','数据倾斜'],

    schema:'CREATE TABLE dwd_sea_container_full (\n  container_no VARCHAR(50),\n  cust_id VARCHAR(50),\n  book_weight DECIMAL(12,2),\n  dt VARCHAR(10),\n  del_flag INT\n);\n\nCREATE TABLE dwd_sea_goods_inbound_full (\n  cargo_no VARCHAR(50),\n  container_no VARCHAR(50),\n  actual_weight DECIMAL(12,2),\n  data_status VARCHAR(20),\n  del_flag INT\n);',
    ref:`WITH container_fact AS (
  SELECT container_no,
         COUNT(DISTINCT cargo_no) AS ticket_cnt,
         SUM(actual_weight)       AS total_w
  FROM dwd_sea_goods_inbound_full
  WHERE data_status = '有效' AND del_flag = 0
  GROUP BY container_no
),
cust_metric AS (
  SELECT c.cust_id,
         COUNT(1) AS total_cnt,
         SUM(IF(f.ticket_cnt IS NULL, 1, 0))                    AS empty_cnt,
         SUM(IF(f.total_w > c.book_weight, 1, 0))               AS over_cnt,
         SUM(IF(f.ticket_cnt IS NOT NULL AND f.ticket_cnt <= 5, 1, 0)) AS compliance_cnt
  FROM dwd_sea_container_full c
  LEFT JOIN container_fact f ON c.container_no = f.container_no
  WHERE c.del_flag = 0 AND c.dt = '2026-09-30'
  GROUP BY c.cust_id
)
SELECT cust_id,
       ROUND((1 - empty_cnt/GREATEST(total_cnt,1)) * 40
           + (1 - over_cnt/GREATEST(total_cnt - empty_cnt, 1)) * 30
           + compliance_cnt/GREATEST(total_cnt, 1) * 30, 2) AS score
FROM cust_metric;`
  }
];

/* ===== 状态 ===== */
const STORE='sql-trainer-questions-v1', PROGRESS='sql-trainer-progress-v1', UNLOCK='sql-trainer-unlock-v1';
function esc(s){ return String(s).replace(/</g,'&lt;'); }
function load(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function save(k,v){ localStorage.setItem(k,JSON.stringify(v)); }
const questions = load(STORE) || SAMPLE;
let progress = load(PROGRESS) || {};
let unlocks = load(UNLOCK) || {};
let curStage = 0, curIdx = 0, wrongMode = false, keyword = '';

/* ===== 工具 ===== */
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1800); }
function stageQ(s){ return questions.filter(q=>q.stage===s); }
function stageStat(s){ const l=stageQ(s); return {total:l.length, done:l.filter(q=>['会','模糊'].includes(progress[q.id])).length, good:l.filter(q=>progress[q.id]==='会').length}; }
function stageUnlocked(s){
  if(s===0 || unlocks[s]) return true;
  return stageStat(s-1).done / stageStat(s-1).total >= 0.75;
}
function curList(){
  // 搜索时全局查（跨阶段），否则按当前模式/阶段
  let list = keyword ? questions.slice()
    : wrongMode ? questions.filter(q=>['不会','模糊'].includes(progress[q.id]))
    : stageQ(curStage);
  if(keyword){
    const k = keyword.toLowerCase();
    list = list.filter(q=>(q.id+q.title+q.desc+(q.tags||[]).join()).toLowerCase().includes(k));
  }
  return list;
}

/* ===== 顶部统计 ===== */
function title(){
  const n=questions.filter(q=>['会','模糊'].includes(progress[q.id])).length;
  if(n>=37) return '👑 数仓战神'; if(n>=32) return '⚡ 调优侠'; if(n>=20) return '🧱 搬砖工'; if(n>=8) return '🔨 练手生'; return '🔍 SQL萌新';
}
function stars(s){
  const st=stageStat(s), r=st.total?st.good/st.total:0;
  return r>=0.8?'⭐⭐⭐':r>=0.5?'⭐⭐':st.good>0?'⭐':'';
}
function renderStats(){
  document.getElementById('rTitle').textContent=title();
  const good=questions.filter(q=>progress[q.id]==='会').length,
        mid=questions.filter(q=>progress[q.id]==='模糊').length,
        bad=questions.filter(q=>progress[q.id]==='不会').length,
        none=questions.length-good-mid-bad;
  document.getElementById('sDone').textContent=good+mid;
  document.getElementById('sGood').textContent=good;
  document.getElementById('sMid').textContent=mid;
  document.getElementById('sBad').textContent=bad;
  const seg=[[good,'var(--green)'],[mid,'var(--yellow)'],[bad,'var(--red)'],[none,'var(--line)']];
  document.getElementById('distBar').innerHTML=seg.map(([n,c])=>`<i style="width:${n/questions.length*100}%;background:${c}"></i>`).join('');
  const w=questions.filter(q=>['不会','模糊'].includes(progress[q.id])).length;
  document.getElementById('wrongCnt').textContent=w?`(${w})`:'';
  document.getElementById('sMode').innerHTML = wrongMode ? '<span class="chip final">🔁 错题模式 · <a href="#" onclick="exitWrongMode();return false" style="color:var(--blue)">退出</a></span>' : '';
}

/* ===== 闯关地图 ===== */
function renderStages(){
  document.getElementById('stageList').innerHTML = STAGES.map(s=>{
    const st=stageStat(s.id), pct=Math.round(st.done/st.total*100);
    const unl=stageUnlocked(s.id), active=!wrongMode && curStage===s.id;
    return `<div class="stageitem ${active?'active':''} ${unl?'':'locked'}" onclick="clickStage(${s.id})">
      <div class="row1"><span class="dot" style="background:${s.color}"></span>${s.name} ${unl?'':'🔒'}
        <span class="pct">${st.done}/${st.total} ${stars(s.id)}</span></div>
      <div class="bar"><i style="width:${pct}%;background:${s.color}"></i></div>
      <div class="desc">${s.desc}${unl?'':' · 刷完上一关 75% 解锁'}</div>
    </div>`;
  }).join('');
}
function clickStage(s){
  if(!stageUnlocked(s)){
    const prev=STAGES[s-1], st=stageStat(s-1);
    if(confirm(`「${prev.name}」还没刷完（${st.done}/${st.total}，需 75%）。确定要跳关吗？`)){
      unlocks[s]=true; save(UNLOCK,unlocks);
    } else return;
  }
  wrongMode=false; curStage=s; curIdx=0; renderAll();
}
function openWrongMode(){
  const w=questions.filter(q=>['不会','模糊'].includes(progress[q.id]));
  if(!w.length){ toast('没有错题，全部掌握 🎉'); return; }
  wrongMode=true; curIdx=0; renderAll(); toast(`错题模式：${w.length} 题`);
}
function exitWrongMode(){ wrongMode=false; curIdx=0; renderAll(); }

/* ===== 题目列表 ===== */
function renderList(){
  const list=curList(), el=document.getElementById('qlist');
  if(!list.length){ el.innerHTML='<div class="empty"><div class="big">🔍</div>没有匹配的题</div>'; return; }
  if(curIdx>=list.length) curIdx=0;
  el.innerHTML=list.map((q,idx)=>{
    const p=progress[q.id];
    const st=p==='会'?'<span class="st" style="color:var(--green)">✓</span>':p==='模糊'?'<span class="st" style="color:#9a6207">?</span>':p==='不会'?'<span class="st" style="color:var(--red)">✗</span>':'';
    return `<div class="qitem ${idx===curIdx?'active':''}" onclick="pickQ(${idx})">
      <div class="t"><span class="qid">${q.id}</span><span class="name">${q.title}</span>${st}</div>
      <div class="meta"><span>${q.level}</span>${(q.tags||[]).slice(0,3).map(t=>`#${t}`).join(' ')}
      ${q.linked&&q.linked.length?`<span class="lk">→${q.linked.join(',')}</span>`:''}</div>
    </div>`;
  }).join('');
}
function pickQ(i){ curIdx=i; renderList(); renderQ(); }

/* ===== 做题面板 ===== */
function fmtDesc(d){
  return d.split('\n').map(line=>{
    const s=line.trim(); if(!s) return '';
    if(s.startsWith('📌')) return '';
    if(s.startsWith('口径：')||s.startsWith('口径:')) return `<div class="caliber">📏 ${s}</div>`;
    return s;
  }).filter(Boolean).join('<br>');
}
function renderQ(){
  const pane=document.getElementById('qpanel'), list=curList();
  if(!list.length){ pane.innerHTML='<div class="empty"><div class="big">👈</div><p>选一道题开始</p></div>'; return; }
  const q=list[curIdx], p=progress[q.id], s=STAGES[q.stage];
  const ans=load('answer-'+q.id)||'';
  const steps=STEPS[q.id];

  pane.innerHTML=`
    <div class="qhead"><span class="qidbig">${q.id}</span><span class="qtitle">${q.title}</span></div>
    <div class="chips">
      <span class="chip lvl-${q.level}">${q.level}</span>
      <span class="chip">${s.name}</span>
      ${(q.tags||[]).map(t=>`<span class="chip">#${t}</span>`).join('')}
      ${(q.linked||[]).map(id=>`<span class="chip link" onclick="jumpTo('${id}')">→ ${id}</span>`).join('')}
      ${steps?`<span class="chip final">🏆 终极题 · ${q.id}</span>`:''}
      ${p?`<span class="chip">${p==='会'?'✓ 掌握':p}</span>`:''}
    </div>
    <div class="qdesc">${fmtDesc(q.desc)}</div>
    ${steps?`<div class="stepsbox"><div class="hd">🪜 解题步骤（先自己想，卡住了再看一条）</div>
      ${steps.map((st,i)=>`<div class="st"><a href="#" onclick="toggleStep(this);return false" style="color:var(--blue);text-decoration:none">步骤 ${i+1} ▸</a>　<span style="display:none">${st}</span></div>`).join('')}</div>`:''}
    <div class="editorwrap">
      <div class="edlabel">✏️ 你的 SQL<span class="kks">Tab 缩进 · ⌘/Ctrl+Enter 下一题</span>
        <span class="spacer" style="flex:1"></span>
        <button class="abtn" style="padding:4px 12px;font-size:11.5px" onclick="runCheck('${q.id}')">✅ 考点自检</button>
        <button class="abtn" style="padding:4px 12px;font-size:11.5px" onclick="toggleHint('${q.id}')">💡 提示</button>
      </div>
      <textarea id="answer" placeholder="在这里写你的 SQL…">${ans.replace(/</g,'&lt;')}</textarea>
      <div class="checkarea" id="checkArea"></div>
      <div id="hintArea"></div>
      <div id="refArea"></div>
    </div>
    <div class="actions">
      <button class="abtn good ${p==='会'?'on':''}" onclick="rate('${q.id}','会')">😎 掌握</button>
      <button class="abtn mid ${p==='模糊'?'on':''}" onclick="rate('${q.id}','模糊')">🤔 模糊</button>
      <button class="abtn bad ${p==='不会'?'on':''}" onclick="rate('${q.id}','不会')">😵 不会</button>
      <button class="abtn" onclick="unrate('${q.id}')">重置</button>
      <span class="spacer"></span>
      <button class="abtn" id="prevBtn" onclick="nav(-1)" ${curIdx===0?'disabled':''}>←</button>
      <span class="ratehint">${curIdx+1} / ${list.length}</span>
      <button class="abtn" id="nextBtn" onclick="nav(1)" ${curIdx===list.length-1?'disabled':''}>→</button>
    </div>`;

  document.getElementById('hintArea').innerHTML=renderHintHtml(q.id);
  document.getElementById('checkArea').innerHTML=renderCheckHtml(q.id);
  document.getElementById('refArea').innerHTML=renderRefHtml(q.id);
  const ta=document.getElementById('answer');
  ta.addEventListener('input',()=>save('answer-'+q.id,ta.value));
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){ e.preventDefault();
      const s0=ta.selectionStart;
      ta.value=ta.value.slice(0,s0)+'  '+ta.value.slice(ta.selectionEnd);
      ta.selectionStart=ta.selectionEnd=s0+2;
      save('answer-'+q.id,ta.value);
    }
    if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){ e.preventDefault(); nav(1); }
  });
}
function toggleStep(a){
  const sp=a.nextElementSibling;
  const show=sp.style.display==='none';
  sp.style.display=show?'inline':'none';
  a.textContent=a.textContent.replace(/▸|▾/,show?'▾':'▸');
}
function randomQ(){
  const q=questions[Math.floor(Math.random()*questions.length)];
  jumpTo(q.id);
  toast('🎲 抽中 '+q.id+' · '+STAGES[q.stage].name);
}
function jumpTo(id){
  const q=questions.find(x=>x.id===id);
  if(!q) return;
  wrongMode=false; keyword=''; document.getElementById('searchInput').value='';
  curStage=q.stage;
  const list=stageQ(q.stage);
  curIdx=list.findIndex(x=>x.id===id);
  renderAll();
}
const UI_OPEN={hint:new Set(),ref:new Set()};
let CHECK_CACHE={};
function toggleHint(id){
  if(UI_OPEN.hint.has(id)) UI_OPEN.hint.delete(id); else UI_OPEN.hint.add(id);
  const el=document.getElementById('hintArea'); if(el) el.innerHTML=renderHintHtml(id);
}
function renderHintHtml(id){
  return UI_OPEN.hint.has(id)?`<div class="hintbox">💡 ${HINTS[id]||'再想想口径和考点标签。'}</div>`:'';
}
function renderCheckHtml(id){
  const items=CHECK_CACHE[id]; if(!items) return '';
  const pass=items.filter(i=>i.ok).length;
  return items.map(i=>`<div class="checkitem ${i.ok?'ok':'miss'}">${i.ok?'✓':'✗'} ${i.l}</div>`).join('')
    +(pass===items.length?'<div class="checkall">🎉 考点全覆盖！可以对照参考答案了</div>'
      :`<div class="checkitem miss" style="margin-top:4px">${pass}/${items.length} 覆盖，缺的考点想想再补</div>`);
}
function runCheck(id){
  const ans=(document.getElementById('answer').value||'').toLowerCase();
  const area=document.getElementById('checkArea');
  if(!ans.trim()){ CHECK_CACHE[id]=null; area.innerHTML='<div class="checkitem miss">还没写答案，先动笔再自检。</div>'; return; }
  CHECK_CACHE[id]=(CHECKS[id]||[]).map(it=>({l:it.l, ok: it.re?it.re.test(ans):ans.includes(it.kw)}));
  area.innerHTML=renderCheckHtml(id);
}
function renderRefHtml(id){
  if(!UI_OPEN.ref.has(id)) return '';
  const q=questions.find(x=>x.id===id);
  const mine=load('answer-'+id)||'（还没写）';
  return `<div class="refbox">
      <div class="rb-hd">📋 参考答案 · 对照完记得评分</div>
      <div class="compare">
        <div class="cmp"><div class="clabel">你的答案</div><pre class="mine">${esc(mine)}</pre></div>
        <div class="cmp"><div class="clabel">参考答案</div><pre>${esc(q.ref)}</pre></div>
      </div></div>`;
}
function askRef(id){
  if(UI_OPEN.ref.has(id)){ UI_OPEN.ref.delete(id); const el=document.getElementById('refArea'); if(el) el.innerHTML=''; return; }
  const hasAns=(document.getElementById('answer').value||'').trim().length>0;
  if(!CHECK_CACHE[id] && hasAns){
    if(!confirm('建议先点「✅ 考点自检」对照考点，再看答案效果更好。\n直接看参考答案？')) return;
  }
  UI_OPEN.ref.add(id);
  const el=document.getElementById('refArea');
  el.innerHTML=renderRefHtml(id);
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
let streak = load('sql-trainer-streak-v1') || {n:0};
function rate(id,v){
  progress[id]= progress[id]===v ? undefined : v;
  if(!progress[id]) delete progress[id];
  save(PROGRESS,progress);
  if(v==='会' && progress[id]==='会'){ streak.n++; save('sql-trainer-streak-v1',streak); }
  else { streak.n=0; save('sql-trainer-streak-v1',streak); }
  renderStats(); renderStages(); renderList(); renderQ();
  if(progress[id]==='会') toast(streak.n>=3?`🔥 连击 ${streak.n}！手感火热`:'已标记掌握 💪');
  else toast('已标记 '+v);
}
function unrate(id){ delete progress[id]; save(PROGRESS,progress); renderStats(); renderStages(); renderList(); renderQ(); }
function nav(d){
  const list=curList();
  const ni=curIdx+d;
  if(ni<0||ni>=list.length) return;
  curIdx=ni; renderList(); renderQ();
  document.getElementById('qpanel').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ===== 表结构抽屉 ===== */
let curTab=0;
function renderDrawer(){
  document.getElementById('ttabs').innerHTML=SAMPLE_TABLES.map((t,i)=>
    `<button class="ttab ${i===curTab?'active':''}" onclick="curTab=${i};renderDrawer()">${t.name}</button>`).join('');
  const t=SAMPLE_TABLES[curTab];
  document.getElementById('tbody').innerHTML=`<div class="tcard">
    <div class="tname">${t.name}</div><div class="tdesc">${t.comment}</div>
    <table class="ftable"><thead><tr><th>字段</th><th>类型</th><th>说明</th></tr></thead>
    <tbody>${t.fields.map(f=>`<tr><td class="f">${f.n}</td><td class="ty">${f.t}</td><td>${f.c}</td></tr>`).join('')}</tbody></table>
    <div class="tsample"><div class="lb">示例数据</div><pre>${t.sample}</pre></div></div>`;
}
function openDrawer(){ renderDrawer(); document.getElementById('drawer').classList.add('on'); document.getElementById('mask').classList.add('on'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('on'); document.getElementById('mask').classList.remove('on'); }

/* ===== 全局渲染 / 事件 ===== */
function renderAll(){ renderStats(); renderStages(); renderList(); renderQ(); }
document.getElementById('searchInput').addEventListener('input',e=>{
  keyword=e.target.value.trim(); curIdx=0; renderList(); renderQ();
});
document.addEventListener('keydown',e=>{
  const tag=document.activeElement&&document.activeElement.tagName;
  if(tag==='TEXTAREA'||tag==='INPUT') return;
  if(e.key==='ArrowLeft') nav(-1);
  else if(e.key==='ArrowRight') nav(1);
});
/* 把「📋 看参考答案」按钮挂到提示行旁（避免题面过长）——在 edlabel 里追加 */
renderAll();
</script>
</body>
</html>
