<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="blog-agent langchain concept map">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#faf5ff}
      .sub{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#ddd6fe}
      .left{fill:#201a45;stroke:#a78bfa;stroke-width:1.5;rx:14}
      .right{fill:#132238;stroke:#38bdf8;stroke-width:1.5;rx:14}
      .label{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#f8fafc}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#e0e7ff}
      .code{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#bae6fd}
      .arrow{stroke:#c084fc;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c084fc"/></marker>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <text x="54" y="58" class="title">把 blog-agent 映射到 LangChain 概念</text>
  <text x="54" y="88" class="sub">你的项目没有引入 LangChain，但核心思想已经具备：模型、提示词、检索器、工具、编排链。</text>

  <text x="110" y="145" class="label">LangChain 里的名字</text>
  <text x="730" y="145" class="label">blog-agent 里的实现</text>

  <rect x="80" y="175" width="330" height="72" class="left"/><text x="110" y="207" class="label">ChatModel</text><text x="110" y="229" class="small">调用大模型生成文本</text>
  <rect x="710" y="175" width="360" height="72" class="right"/><text x="740" y="207" class="code">llm_service._chat_completion()</text><text x="740" y="229" class="small">OpenAI / Anthropic 兼容接口</text>

  <rect x="80" y="270" width="330" height="72" class="left"/><text x="110" y="302" class="label">Retriever</text><text x="110" y="324" class="small">从知识库找证据</text>
  <rect x="710" y="270" width="360" height="72" class="right"/><text x="740" y="302" class="code">rag.retriever.retrieve()</text><text x="740" y="324" class="small">读取索引并按分数排序</text>

  <rect x="80" y="365" width="330" height="72" class="left"/><text x="110" y="397" class="label">Tool</text><text x="110" y="419" class="small">让 Agent 能执行动作</text>
  <rect x="710" y="365" width="360" height="72" class="right"/><text x="740" y="397" class="code">tool_service.dispatch_tool()</text><text x="740" y="419" class="small">创建草稿、重建索引、构建博客</text>

  <rect x="80" y="460" width="330" height="72" class="left"/><text x="110" y="492" class="label">Chain / AgentExecutor</text><text x="110" y="514" class="small">决定下一步做什么</text>
  <rect x="710" y="460" width="360" height="72" class="right"/><text x="740" y="492" class="code">chat_service.answer_question()</text><text x="740" y="514" class="small">意图分类、路由、聚合结果</text>

  <path d="M410 211 L710 211" class="arrow"/>
  <path d="M410 306 L710 306" class="arrow"/>
  <path d="M410 401 L710 401" class="arrow"/>
  <path d="M410 496 L710 496" class="arrow"/>
</svg>
