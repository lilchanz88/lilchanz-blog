<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="blog-agent overall architecture">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}
      .sub{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}
      .box{fill:#182235;stroke:#334155;stroke-width:1.5;rx:16;filter:url(#shadow)}
      .box2{fill:#102a37;stroke:#0891b2;stroke-width:1.5;rx:16;filter:url(#shadow)}
      .label{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#e5e7eb}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#cbd5e1}
      .code{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#93c5fd}
      .arrow{stroke:url(#accent);stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <text x="56" y="58" class="title">blog-agent 总体架构</text>
  <text x="56" y="88" class="sub">FastAPI 接口层负责收请求，chat_service 做编排，RAG/LLM/Tools 分别提供证据、生成和行动能力。</text>

  <rect x="60" y="145" width="190" height="115" class="box"/>
  <text x="86" y="185" class="label">前端 Assistant</text>
  <text x="86" y="215" class="small">输入问题、历史消息</text>
  <text x="86" y="239" class="code">blog-admin</text>

  <rect x="325" y="145" width="205" height="115" class="box"/>
  <text x="352" y="185" class="label">API 路由</text>
  <text x="352" y="215" class="small">访客 / 管理端接口</text>
  <text x="352" y="239" class="code">app/api/*.py</text>

  <rect x="610" y="135" width="245" height="135" class="box2"/>
  <text x="636" y="177" class="label">Agent 编排层</text>
  <text x="636" y="209" class="small">意图判断、模式选择</text>
  <text x="636" y="233" class="small">决定走 LLM / RAG / Tool</text>
  <text x="636" y="255" class="code">chat_service.answer_question</text>

  <rect x="945" y="80" width="195" height="105" class="box"/>
  <text x="972" y="119" class="label">LLM 适配</text>
  <text x="972" y="149" class="small">OpenAI / Anthropic</text>
  <text x="972" y="171" class="code">llm_service.py</text>

  <rect x="945" y="255" width="195" height="105" class="box"/>
  <text x="972" y="294" class="label">RAG 检索</text>
  <text x="972" y="324" class="small">索引、召回、证据</text>
  <text x="972" y="346" class="code">app/rag/*.py</text>

  <rect x="945" y="430" width="195" height="105" class="box"/>
  <text x="972" y="469" class="label">工具执行</text>
  <text x="972" y="499" class="small">建索引、建草稿</text>
  <text x="972" y="521" class="code">tool_service.py</text>

  <rect x="610" y="400" width="245" height="105" class="box"/>
  <text x="636" y="438" class="label">Pydantic Schemas</text>
  <text x="636" y="468" class="small">请求、响应、工具参数</text>
  <text x="636" y="490" class="code">schemas.py</text>

  <path d="M250 203 C275 203 295 203 325 203" class="arrow"/>
  <path d="M530 203 C555 203 580 203 610 203" class="arrow"/>
  <path d="M855 185 C890 165 910 140 945 132" class="arrow"/>
  <path d="M855 215 C890 235 910 285 945 307" class="arrow"/>
  <path d="M855 235 C895 290 910 440 945 482" class="arrow"/>
  <path d="M735 270 C735 315 735 360 735 400" class="arrow"/>
</svg>
