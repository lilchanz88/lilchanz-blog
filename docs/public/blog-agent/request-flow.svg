<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="blog-agent request flow">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}
      .sub{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#bfdbfe}
      .step{fill:#172033;stroke:#475569;stroke-width:1.4;rx:14}
      .decision{fill:#233044;stroke:#60a5fa;stroke-width:1.6}
      .label{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#f1f5f9}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#cbd5e1}
      .code{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#93c5fd}
      .arrow{stroke:#67e8f9;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="54" y="58" class="title">一次对话请求的生命周期</text>
  <text x="54" y="88" class="sub">理解这张图，就能理解 blog-agent 的主干逻辑。</text>

  <rect x="70" y="145" width="205" height="92" class="step"/>
  <text x="95" y="178" class="label">1. 用户发送消息</text>
  <text x="95" y="207" class="small">message + history</text>

  <rect x="350" y="145" width="220" height="92" class="step"/>
  <text x="375" y="178" class="label">2. FastAPI 接收</text>
  <text x="375" y="207" class="code">admin_chat / chat</text>

  <rect x="650" y="145" width="240" height="92" class="step"/>
  <text x="675" y="178" class="label">3. 进入编排函数</text>
  <text x="675" y="207" class="code">answer_question()</text>

  <polygon points="765,305 895,375 765,445 635,375" class="decision"/>
  <text x="714" y="366" class="label">4. 意图判断</text>
  <text x="692" y="395" class="small">status / tool / rag / chat</text>

  <rect x="90" y="510" width="220" height="92" class="step"/>
  <text x="115" y="543" class="label">状态查询</text>
  <text x="115" y="572" class="code">model_status()</text>

  <rect x="360" y="510" width="220" height="92" class="step"/>
  <text x="385" y="543" class="label">工具调用</text>
  <text x="385" y="572" class="code">dispatch_tool()</text>

  <rect x="630" y="510" width="220" height="92" class="step"/>
  <text x="655" y="543" class="label">RAG 问答</text>
  <text x="655" y="572" class="code">retrieve() + LLM</text>

  <rect x="900" y="510" width="220" height="92" class="step"/>
  <text x="925" y="543" class="label">普通模型对话</text>
  <text x="925" y="572" class="code">generate_general_answer()</text>

  <path d="M275 191 L350 191" class="arrow"/>
  <path d="M570 191 L650 191" class="arrow"/>
  <path d="M770 237 L770 305" class="arrow"/>
  <path d="M635 375 C470 390 250 450 200 510" class="arrow"/>
  <path d="M685 425 C610 455 530 480 470 510" class="arrow"/>
  <path d="M765 445 L740 510" class="arrow"/>
  <path d="M895 375 C980 405 1010 460 1010 510" class="arrow"/>
</svg>
